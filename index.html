<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calm Mind - Meet Your Emotions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: #0a0a0f;
      --bg-soft: #12121a;
      --panel: #171821;
      --panel-2: #1d1d2a;
      --muted: #b8b8c0;
      --muted-2: #8a8a95;
      --primary: #8b7eff;
      --primary-2: #a09bff;
      --mint: #a0d8d0;
      --line: rgba(255,255,255,0.08);
      --shadow: rgba(139,126,255,0.35);
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    body{
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(139,126,255,0.18), transparent 30%),
        radial-gradient(circle at bottom right, rgba(160,216,208,0.10), transparent 30%),
        var(--bg);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    a { text-decoration: none; color: inherit; }

    nav{
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 26px 60px;
      position: relative;
      z-index: 2;
    }

    .logo{
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--mint);
      font-weight: 700;
    }

    .logo-mark{
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--mint), #dffaf5);
      box-shadow: 0 0 18px rgba(160,216,208,0.5);
      position: relative;
    }

    .logo-mark::before{
      content: "";
      position: absolute;
      inset: 4px 3px 6px 3px;
      border-radius: 50% 50% 50% 0;
      background: rgba(10,10,15,0.35);
      transform: rotate(-25deg);
    }

    .nav-links{
      display: flex;
      align-items: center;
      gap: 30px;
      color: var(--muted-2);
      font-size: 14px;
      font-weight: 500;
    }

    .nav-links span{
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .nav-links span:hover{
      color: var(--white);
    }

    .hero{
      display: flex;
      align-items: center;
      gap: 40px;
      min-height: 82vh;
      padding: 25px 60px 60px;
      max-width: 1440px;
      margin: 0 auto;
    }

    .hero-left{
      width: 48%;
      position: relative;
      z-index: 2;
    }

    .eyebrow{
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.02);
      color: var(--mint);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 24px;
      font-weight: 600;
    }

    .hero-left h1{
      margin: 0;
      font-size: clamp(3.2rem, 5vw, 5.2rem);
      line-height: 0.94;
      letter-spacing: -0.07em;
      font-weight: 800;
    }

    .hero-left p{
      margin: 26px 0 0;
      max-width: 590px;
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1.7;
    }

    .btns{
      display: flex;
      align-items: center;
      gap: 18px;
      margin-top: 34px;
      flex-wrap: wrap;
    }

    .btn{
      border: none;
      border-radius: 999px;
      padding: 17px 28px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover{
      transform: translateY(-2px);
    }

    .btn-primary{
      background: linear-gradient(90deg, var(--primary), var(--primary-2));
      color: var(--white);
      box-shadow: 0 18px 38px rgba(139,126,255,0.35);
    }

    .btn-secondary{
      background: rgba(255,255,255,0.02);
      color: var(--white);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .tags{
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 42px;
      flex-wrap: wrap;
    }

    .tag{
      padding: 10px 14px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      font-size: 13px;
      color: #dfe1ea;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .hero-right{
      width: 52%;
      position: relative;
      display: grid;
      grid-template-columns: repeat(2, minmax(180px, 1fr));
      gap: 18px;
      align-items: center;
      min-height: 560px;
      padding-top: 18px;
    }

    .card{
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 18px 40px rgba(0,0,0,0.25);
    }

    .card img{
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(0.9) contrast(1.05);
    }

    .card-1{
      height: 410px;
      transform: translateY(30px);
    }

    .card-2{
      height: 280px;
      transform: translateY(-10px);
    }

    .card-3{
      height: 180px;
      grid-column: 1 / span 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 22px;
      background: linear-gradient(135deg, rgba(139,126,255,0.2), rgba(160,216,208,0.08));
      border: 1px solid rgba(255,255,255,0.08);
    }

    .stat{
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .stat strong{
      font-size: 2.2rem;
      line-height: 1;
      letter-spacing: -0.06em;
    }

    .stat span{
      color: var(--muted);
      font-size: 0.95rem;
    }

    .mini-badge{
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: #ececff;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .glow{
      position: absolute;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(139,126,255,0.28), transparent 60%);
      right: -40px;
      top: 16px;
      filter: blur(30px);
      pointer-events: none;
    }

    @media (max-width: 980px){
      .hero{
        flex-direction: column;
        padding-top: 10px;
      }
      .hero-left, .hero-right{
        width: 100%;
      }
      .hero-right{
        max-width: 640px;
      }
    }

    @media (max-width: 760px){
      nav{
        padding: 22px 24px;
      }
      .nav-links{
        display: none;
      }
      .hero{
        padding: 10px 24px 30px;
      }
      .hero-left h1{
        font-size: clamp(2.8rem, 14vw, 4rem);
      }
      .hero-left p{
        font-size: 1rem;
      }
      .btn{
        width: 100%;
        justify-content: center;
      }
      .btns{
        flex-direction: column;
        align-items: stretch;
      }
      .hero-right{
        grid-template-columns: 1fr 1fr;
        min-height: 420px;
      }
      .card-1{ height: 280px; }
      .card-2{ height: 220px; }
      .card-3{
        grid-column: 1 / span 2;
        padding: 18px 16px;
      }
      .stat strong{
        font-size: 1.7rem;
      }
    }
  </style>
</head>
<body>
  <nav>
    <div class="logo">
      <span class="logo-mark"></span>
      <span>Calm Mind</span>
    </div>

    <div class="nav-links">
      <span>Home</span>
      <span>Meditate</span>
      <span>Journal</span>
      <span>Sessions</span>
      <span>Profile</span>
    </div>
  </nav>

  <section class="hero">
    <div class="hero-left">
      <div class="eyebrow">Emotional wellness</div>
      <h1>Meet Your<br>Emotions</h1>
      <p>
        Track how you feel. Build calm. Be present. A gentle space to check in,
        reflect, and breathe — designed for your mental well-being.
      </p>

      <div class="btns">
        <button class="btn btn-primary">Begin Now →</button>
        <button class="btn btn-secondary">Learn More</button>
      </div>

      <div class="tags">
        <div class="tag">🍃 Mindful</div>
        <div class="tag">✨ Daily Check-ins</div>
        <div class="tag">🛡️ Private &amp; Safe</div>
      </div>
    </div>

    <div class="hero-right">
      <div class="glow"></div>

      <div class="card card-1">
        <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=800&q=80" alt="Person smiling in relaxed mood" />
      </div>

      <div class="card card-2">
        <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=800&q=80" alt="Group of people sitting peacefully" />
      </div>

      <div class="card card-3">
        <div class="stat">
          <strong>12k+</strong>
          <span>daily check-ins</span>
        </div>
        <div class="mini-badge">Calm Track</div>
      </div>
    </div>
  </section>
</body>
</html>
